<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>1級土木・過去問攻略 PRO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{max-width:780px;margin:auto;padding:16px}.hero{padding:20px 4px 16px}.k{color:#35d07f;font-weight:800;font-size:13px}
h1{margin:7px 0;font-size:29px}.muted{color:#9fb0c7;font-size:13px;line-height:1.6}
.card{background:#101c2d;border:1px solid #26364d;border-radius:18px;padding:17px;margin:12px 0}
.mode,.choice,select{width:100%;text-align:left;border:1px solid #30455f;background:#122137;color:#fff;border-radius:14px;padding:15px;margin:6px 0}
.mode b{display:block;font-size:17px}.mode span{display:block;color:#9fb0c7;font-size:12px;margin-top:4px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{border:1px solid #30455f;border-radius:999px;padding:6px 9px;font-size:11px;color:#9fb0c7}
.bar{height:7px;background:#1b2a40;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#35d07f;width:0}
.q{font-size:17px;line-height:1.7;white-space:pre-wrap}.choice.correct{border-color:#35d07f;background:#0e2d20}
.choice.wrong{border-color:#ff667a;background:#32151d}.choice:disabled{opacity:1}
.feedback{margin-top:12px;padding:13px;border-radius:13px;background:#0c1828;border:1px solid #26364d;line-height:1.7;font-size:14px}
.primary{border:0;background:#35d07f;color:#06120c;font-weight:900;border-radius:13px;padding:13px 17px}
.secondary{border:1px solid #344a66;background:#122137;color:#fff;border-radius:13px;padding:12px 17px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.big{font-size:40px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0c1828;padding:12px;border-radius:13px;text-align:center}
.stat b{display:block;font-size:21px;margin-top:3px}.hidden{display:none}footer{color:#70829a;font-size:10px;line-height:1.6;margin:22px 0}
.smallbtn{font-size:12px;padding:10px}.danger{border-color:#6a3340}.catrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){.catrow{grid-template-columns:1fr}.q{font-size:16px}}
</style>
</head>
<body><main>
<div class="hero"><div class="k">1級土木施工管理技術検定</div><h1>過去問攻略 PRO</h1><div class="muted">令和8年度の出題テーマ・4択形式を参考にしたオリジナル類題 500問</div></div>

<section id="home">
<div class="card">
<button class="mode" onclick="startMode('today')"><b>🔥 今日の10問</b><span>500問からランダム。毎日の練習用。</span></button>
<button class="mode" onclick="startMode('mock')"><b>🎯 本番想定35問</b><span>一次検定Bを意識した35問の実戦練習。</span></button>
<button class="mode" onclick="startMode('all')"><b>📚 500問トレーニング</b><span>全問題を順番に消化。</span></button>
<button class="mode" onclick="startWrong()"><b>❌ 間違い問題</b><span id="wrongCount">まだありません。</span></button>
<button class="mode" onclick="startWeak()"><b>🧠 苦手分野から10問</b><span id="weakText">回答履歴をためると判定します。</span></button>
</div>

<div class="card">
<h2 style="margin-top:0">📊 学習状況</h2>
<div class="stats">
<div class="stat"><span class="muted">問題数</span><b>500</b></div>
<div class="stat"><span class="muted">回答数</span><b id="totalAnswered">0</b></div>
<div class="stat"><span class="muted">総合正答率</span><b id="totalRate">—</b></div>
</div>
</div>

<div class="card">
<h2 style="margin-top:0">📚 分野別</h2>
<div id="catStats"></div>
</div>

<div class="card">
<h2 style="margin-top:0">分野を選んで練習</h2>
<select id="catSelect"></select>
<button class="primary" onclick="startCategory()">この分野を10問</button>
</div>
</section>

<section id="quiz" class="hidden">
<div class="top"><span id="cat" class="pill"></span><span id="cnt" class="pill"></span></div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div class="card">
<div id="q" class="q"></div><div id="choices"></div><div id="fb"></div>
<div class="row" style="margin-top:12px"><button id="next" class="primary hidden" onclick="next()">次の問題</button><button class="secondary" onclick="home()">終了</button></div>
</div>
</section>

<section id="result" class="hidden"><div class="card">
<div class="k">RESULT</div><h2>結果</h2><div id="score" class="big"></div>
<div class="stats" style="margin:14px 0"><div class="stat"><span class="muted">正解</span><b id="rc"></b></div><div class="stat"><span class="muted">不正解</span><b id="rw"></b></div><div class="stat"><span class="muted">正答率</span><b id="rr"></b></div></div>
<p id="resultMsg" class="muted"></p>
<div class="row"><button class="primary" onclick="home()">ホーム</button><button class="secondary" onclick="startWrong()">間違い復習</button></div>
</div></section>

<footer>
収録：オリジナル類題500問。令和8年度第一次検定の公開問題・正答肢を参照し、同一問題文の転載ではなく論点・出題形式を変形した学習用問題として構成しています。
法令・数値・基準は改正されることがあるため、受験時は最新の公式資料で確認してください。
</footer>
</main>
<script>
const qs=[{"id":"P001","category":"土工","question":"盛土の締固めで、締固め度を高めるために最も基本的に確認すべき条件はどれか。","choices":["土の色だけを見る","適切な含水状態と締固め方法を確保する","盛土厚をできるだけ大きくする","転圧回数を必ず1回にする"],"answer":2,"explanation":"土質に応じた含水状態と適切な層厚・締固め機械・回数を確保することが基本。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P002","category":"土工","question":"盛土を施工する際、一層の仕上り厚を大きくしすぎると起こりやすいものはどれか。","choices":["内部まで十分に締め固めにくくなる","土の含水比が必ず0%になる","施工速度が必ず低下する","路床の支持力が必ず増加する"],"answer":1,"explanation":"一層が厚すぎると転圧の影響が内部まで届きにくく、締固め不足につながる。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P003","category":"土工","question":"軟弱地盤上に盛土を施工する場合、施工前に特に把握すべきものはどれか。","choices":["地盤の支持力や沈下特性","作業員の通勤経路だけ","使用する標識の色","完成後の植栽だけ"],"answer":1,"explanation":"支持力、圧密沈下、地下水などの地盤条件を把握して施工計画を立てる。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P004","category":"土工","question":"切土法面の安定を検討する際、重要性が最も低いものはどれか。","choices":["地質・土質条件","地下水の状況","法面形状","作業員の休憩時間"],"answer":4,"explanation":"法面安定には地質、土質、地下水、法面勾配などが重要。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P005","category":"土工","question":"盛土材料として使用する土の品質を確認する主な目的はどれか。","choices":["所定の強度・安定性などを確保する","運搬車両の台数を減らす","写真撮影を省略する","契約金額を自動的に変更する"],"answer":1,"explanation":"盛土の安定性や支持性能を確保するため、材料の性状を確認する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P006","category":"土工","question":"法面の表面侵食を抑制する対策として適当なものはどれか。","choices":["法面を適切に被覆する","法面を裸地のまま放置する","排水施設を撤去する","表面を常に掘削する"],"answer":1,"explanation":"植生工や法枠工など、現場条件に応じた法面保護が侵食抑制に用いられる。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P007","category":"土工","question":"盛土施工中の降雨による影響を小さくするための対応として適当なものはどれか。","choices":["排水を確保し、必要に応じて施工を調整する","雨水を盛土内へ集める","締固めを無条件で継続する","法面排水を閉塞する"],"answer":1,"explanation":"降雨時は排水、施工面の保護、施工中止などを状況に応じて判断する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P008","category":"土工","question":"土の含水比が最適含水比より著しく高い状態で締め固めると、一般に起こりやすいものはどれか。","choices":["締固めが困難になる","必ず最大乾燥密度を上回る","土粒子が消失する","土が完全に乾燥する"],"answer":1,"explanation":"過湿状態では転圧してもこね返しなどが生じ、十分な締固めが得にくい。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P009","category":"土工","question":"路床の施工で支持力を確保するために重要なものはどれか。","choices":["所定の材料・含水状態・締固めを管理する","路床を無管理で放置する","排水を考慮しない","施工後の検査を省略する"],"answer":1,"explanation":"路床の品質は材料、含水状態、締固め、排水などを適切に管理して確保する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P010","category":"土工","question":"建設発生土を一時保管する場合、適当な対応はどれか。","choices":["周辺環境や安全に配慮して適切に管理する","異物を混入させる","排水対策をしない","公道上に無許可で堆積する"],"answer":1,"explanation":"飛散・流出・崩壊や周辺環境への影響を防ぐ管理が必要。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P011","category":"コンクリート","question":"コンクリートの打込みで材料分離を防ぐために適当なものはどれか。","choices":["過大な落下高さを避ける","落下高さをできるだけ大きくする","長時間静置する","粗骨材だけを先に投入する"],"answer":1,"explanation":"過大な落下や不適切な運搬・打込みは材料分離を招く。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P012","category":"コンクリート","question":"コンクリートの締固めの主な目的はどれか。","choices":["内部の空隙を減らし密実にする","水分を完全に蒸発させる","骨材を分離させる","凝結を停止させる"],"answer":1,"explanation":"適切な振動締固めなどで空隙を減らし、密実なコンクリートにする。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P013","category":"コンクリート","question":"コンクリートの養生で最も基本的な考え方はどれか。","choices":["硬化に必要な温度・湿潤状態を確保する","できるだけ早く乾燥させる","表面を常に強風にさらす","打込み直後に急冷する"],"answer":1,"explanation":"セメントの水和が適切に進む条件を確保することが養生の基本。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P014","category":"コンクリート","question":"コンクリートの打重ねを行う場合、適当な対応はどれか。","choices":["適切な時間間隔と打重ね方法を管理する","前層を完全に乾燥させてから無条件に打つ","前層の状態を確認しない","打重ね面を汚れたままにする"],"answer":1,"explanation":"コールドジョイント防止のため、打重ね時間、打重ね面、締固めなどを管理する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P015","category":"コンクリート","question":"寒中コンクリートで特に注意すべきものはどれか。","choices":["初期凍害の防止","骨材の完全乾燥だけ","日射量の増加","塩分濃度を必ず0にする"],"answer":1,"explanation":"初期材齢で凍結すると強度発現に悪影響があるため、適切な温度管理が必要。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P016","category":"コンクリート","question":"暑中コンクリートで注意すべきものはどれか。","choices":["コンクリート温度やスランプ低下、凝結の促進","凍結による初期凍害だけ","積雪荷重だけ","骨材の凍結だけ"],"answer":1,"explanation":"高温時は運搬・打込み中の温度上昇や急速な凝結などに注意する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P017","category":"コンクリート","question":"鉄筋コンクリートでかぶりを確保する主な目的はどれか。","choices":["鉄筋の腐食防止や耐火性などを確保する","コンクリートを軽量化する","鉄筋を細くする","施工写真を減らす"],"answer":1,"explanation":"所定のかぶりは鉄筋の防食、耐火性、構造上の要求などに関係する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P018","category":"コンクリート","question":"コンクリートのスランプ試験が主に示すものはどれか。","choices":["フレッシュコンクリートのコンシステンシー","硬化後の圧縮強度そのもの","鉄筋の降伏点","骨材の粒度だけ"],"answer":1,"explanation":"スランプはフレッシュコンクリートの軟らかさ・変形性を確認する指標。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P019","category":"コンクリート","question":"単位水量を必要以上に増加させると、一般にどうなりやすいか。","choices":["硬化後の強度や耐久性に悪影響を及ぼす","必ず強度が増加する","鉄筋量が増加する","骨材の密度が増加する"],"answer":1,"explanation":"水セメント比の増加は一般に強度・耐久性を低下させる方向に働く。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P020","category":"コンクリート","question":"コンクリートの施工継目を設ける場合、適当な考え方はどれか。","choices":["構造・施工条件に応じて位置と処理方法を計画する","どこに設けても影響はない","必ず部材中央に設ける","処理を一切行わない"],"answer":1,"explanation":"施工継目は構造上の影響や施工性を考慮して位置・方向・処理を計画する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P021","category":"施工管理","question":"施工計画を立案する際、最初に重要となるものはどれか。","choices":["契約図書・現場条件などの把握","作業員の私物確認","完成後の広告作成","休憩室の装飾"],"answer":1,"explanation":"契約条件、設計図書、現場条件、関係法令などを把握して施工計画を立てる。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P022","category":"施工管理","question":"工程が予定より遅れていることが判明した場合、最初の対応として適当なものはどれか。","choices":["遅延原因を分析する","遅延を記録しない","無条件で残業を増やす","品質管理を中止する"],"answer":1,"explanation":"原因を把握した上で、施工方法、資機材、人員などの回復策を検討する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P023","category":"施工管理","question":"ネットワーク式工程表で、作業間の先行・後続関係を示す主な目的はどれか。","choices":["工程上の関連を把握する","材料の化学成分を確認する","安全標識を設計する","完成写真を整理する"],"answer":1,"explanation":"作業の順序関係や工程上のクリティカルな部分を把握するために用いる。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P024","category":"施工管理","question":"施工管理におけるPDCAの「C」は何を意味するか。","choices":["Check","Change","Con を変更する場合、適当な対応はどれか。","choices":["変更による危険を評価し、関係者へ周知する","作業員に知らせない","安全設備を減らす","変更理由を記録しない"],"answer":1,"explanation":"手順変更による新たな危険を検討し、必要な対策と周知を行う。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P041","category":"測量","question":"TS（トータルステーション）を用いた測量で測定できるものとして適当なのはどれか。","choices":["角度と距離","コンクリート強度","土の含水比","鉄筋径"],"answer":1,"explanation":"TSは角度・距離を測定し、位置情報などの算出に利用する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P042","category":"測量","question":"水準測量の主な目的はどれか。","choices":["2点間の高低差や標高を求める","材料強度を測る","土質を分類する","施工機械の燃費を測る"],"answer":1,"explanation":"レベル等を用いて高低差を測定し、標高を求める。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P043","category":"測量","question":"測量で器械点の位置や既知点との関係を確認する主な理由はどれか。","choices":["測定結果の位置的な信頼性を確保する","写真枚数を増やす","機械を軽くする","作業員を減らす"],"answer":1,"explanation":"既知点との関係を適切に設定・確認することが測量精度に重要。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P044","category":"測量","question":"測量器械を据え付ける際に重要なものはどれか。","choices":["整準・求心を適切に行う","三脚を不安定にする","器械高を記録しない","視準対象を動かす"],"answer":1,"explanation":"器械の整準・求心を適切に行い、測定条件を正確にする。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P045","category":"測量","question":"UAV測量を施工管理に利用する際、適当な考え方はどれか。","choices":["飛行条件や安全、必要な精度を確認する","どこでも無条件に飛行する","精度確認をしない","飛行経路を記録しない"],"answer":1,"explanation":"飛行空域、周辺安全、計測精度、データ処理方法などを事前に確認する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P046","category":"測量","question":"出来形測量で設計値と実測値を比較する主な目的はどれか。","choices":["規格・出来形への適合を確認する","施工機械の燃料を測る","作業員の人数を決める","契約金額を自動決定する"],"answer":1,"explanation":"実測値を設計値や規格値と比較して出来形を確認する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P047","category":"測量","question":"測量結果に異常な値が出た場合、適当な対応はどれか。","choices":["測定条件や器械、既知点等を確認して再測定を検討する","異常値をそのまま採用する","記録を削除する","別の作業員に無条件で任せる"],"answer":1,"explanation":"異常値は測定条件・器械・観測手順等を確認し、必要なら再測定する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P048","category":"測量","question":"基準点を施工管理に使用する場合、適当なものはどれか。","choices":["位置・標高の管理状態を確認し適切に使用する","移動しても記録しない","誰でも自由に移動させる","点の管理を行わない"],"answer":1,"explanation":"基準点は施工の位置・高さの基準となるため、保全と管理が重要。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P049","category":"測量","question":"出来形管理で測定箇所を選定する際に重要なものはどれか。","choices":["設計・管理基準に基づいて適切に選定する","都合の良い箇所だけ測る","異常がありそうな箇所を避ける","測定箇所を記録しない"],"answer":1,"explanation":"管理基準や施工条件に基づき、代表性を確保して測定する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P050","category":"測量","question":"測量データを電子的に管理する場合、適当なものはどれか。","choices":["原データや処理手順を適切に保存する","都合の悪いデータを削除する","バックアップを取らない","測定日時を記録しない"],"answer":1,"explanation":"原データ、処理履歴、必要なバックアップ等を適切に管理する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P051","category":"道路・舗装","question":"アスファルト混合物の施工で温度管理が重要な理由はどれか。","choices":["施工性や締固め性に影響するため","骨材の比重が必ず変わるため","道路幅員が変わるため","交通量が増えるため"],"answer":1,"explanation":"混合物温度は敷均し・転圧性や品質に大きく影響する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P052","category":"道路・舗装","question":"路盤の締固めで重要なものはどれか。","choices":["適切な含水状態と転圧方法を確保する","転圧を必ず1回にする","材料の粒度を確認しない","施工後に締固めを行う"],"answer":1,"explanation":"材料条件と含水状態に応じた締固め方法・回数を管理する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P053","category":"道路・舗装","question":"アスファルト舗装の施工継目で重要なものはどれか。","choices":["継目部の接合状態を良好にする","継目を無処理で放置する","継目を必ず水で濡らす","継目位置を無計画にする"],"answer":1,"explanation":"継目は締固めや接着状態を確保し、弱点にならないよう施工する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P054","category":"道路・舗装","question":"舗装のわだち掘れの原因として考えられるものはどれか。","choices":["交通荷重や高温時の塑性変形など","降雪が一度もないこと","標識の不足","路肩の植生だけ"],"answer":1,"explanation":"交通荷重、材料特性、温度などがわだち掘れに影響する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P055","category":"道路・舗装","question":"路床の排水を適切にする主な目的はどれか。","choices":["含水状態の悪化や支持力低下を防ぐ","交通量を増やす","舗装厚を自動的に減らす","標識を不要にする"],"answer":1,"explanation":"過剰な水は路床・路盤の支持性能や耐久性に悪影響を与える。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P056","category":"道路・舗装","question":"舗装厚を決定する際に考慮すべきものはどれか。","choices":["交通条件や路床条件など","作業員の年齢だけ urce_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P081","category":"法規","question":"建設工事の施工において関係法令を確認する主な理由はどれか。","choices":["法令に適合した施工を行うため","工事写真を減らすため","契約を不要にするため","作業員を減らすため"],"answer":1,"explanation":"建設工事は労働安全、建設業、環境等の関係法令を遵守して施工する必要がある。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P082","category":"法規","question":"産業廃棄物を適正に処理するために重要なものはどれか。","choices":["種類・分別・委託先等を適切に管理する","すべて混合する","排出場所に放置する","処理記録を残さない"],"answer":1,"explanation":"廃棄物の種類に応じて分別、保管、委託、記録等を適切に行う。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P083","category":"法規","question":"建設発生土を搬出する際に重要なものはどれか。","choices":["搬出先や運搬、周辺環境への影響を適切に管理する","道路上に無計画に置く","搬出先を確認しない","混入物を確認しない"],"answer":1,"explanation":"発生土は搬出先、運搬経路、飛散・流出等を適切に管理する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P084","category":"法規","question":"労働災害防止のため、作業主任者等が必要となる作業ではどうするべきか。","choices":["関係法令に従って必要な者を選任・配置する","選任を省略する","経験だけで代用する","現場ごとに無関係に決める"],"answer":1,"explanation":"法令で定められた作業では必要な資格・選任等を確実に行う。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P085","category":"法規","question":"道路上で工事を行う場合、重要なものはどれか。","choices":["道路管理者・警察等との必要な手続きや安全対策を行う","道路を無許可で占用する","交通規制を設けない","歩行者を無視する"],"answer":1,"explanation":"道路使用・占用等の関係手続きと、交通安全対策を適切に行う。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P086","category":"法規","question":"建設工事における安全衛生管理で適当なものはどれか。","choices":["関係者の役割と安全管理体制を明確にする","安全管理を作業員任せにする","点検を行わない","災害情報を共有しない"],"answer":1,"explanation":"施工体制に応じて安全衛生管理の責任・役割を明確にし、情報共有する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P087","category":"法規","question":"環境保全の観点から工事で発生する濁水を扱う場合、適当な対応はどれか。","choices":["必要な処理を行い適切に排水する","無処理で河川へ放流する","濁度を確認しない","排水経路を記録しない"],"answer":1,"explanation":"濁水は周辺水域への影響を考慮し、必要な沈殿・処理等を行う。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P088","category":"法規","question":"工事現場で騒音・振動対策を行う際、適当なものはどれか。","choices":["施工時間や機械・工法等を検討し影響を抑える","苦情が出ても対応しない","すべての作業を深夜に行う","測定や記録を一切行わない"],"answer":1,"explanation":"周辺 性等を総合的に比較する","費用だけで決める","施工速度だけで決める","作業員の好みだけで決める"],"answer":1,"explanation":"施工方法は品質、安全、工程、環境、経済性等を総合的に評価する。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P097","category":"施工管理法・応用能力","question":"計画した施工方法で安全が確保できないことが判明した場合、適当な対応はどれか。","choices":["施工方法を見直し、リスクを低減する","計画どおり続行する","安全設備を減らす","危険を記録しない"],"answer":1,"explanation":"計画段階でも施工中でも、安全が確保できない場合は方法を見直す必要がある。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P098","category":"施工管理法・応用能力","question":"検査で規格外が判明した場合、適当な対応はどれか。","choices":["規格外の原因を確認し、必要な処置を行う","合格扱いにする","測定値を書き換える","検査記録を削除する"],"answer":1,"explanation":"規格外を隠さず、原因確認、是正、再検査等を適切に行う。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P099","category":"施工管理法・応用能力","question":"施工中に周辺住民への影響が増大した場合、適当な対応はどれか。","choices":["原因を把握し、施工時間・方法等の対策を検討する","苦情を無視する","作業を増やす","記録を残さない"],"answer":1,"explanation":"周辺環境への影響を把握し、必要な施工方法・時間・設備等の対策を講じる。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P100","category":"施工管理法・応用能力","question":"施工管理で重要な情報を関係者へ伝達する際、最も適当なものはどれか。","choices":["必要な内容を正確・具体的に共有し、記録を残す","口頭だけで曖昧に伝える","重要情報を一部の人だけに隠す","記録を作らない"],"answer":1,"explanation":"安全・品質・工程に関わる情報は正確に共有し、必要な記録を残す。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P101","category":"土工","question":"土の含水比と乾燥密度の関係を表す曲線として適当なものはどれか。","choices":["締固め曲線","時間と圧密量の関係を示す曲線","温度とコンクリート強度の関係を示す曲線","交通量と舗装厚の関係を示す曲線"],"answer":1,"explanation":"含水比と乾燥密度の関係を表し、通常は最適含水比付近で最大乾燥密度となる。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P102","category":"土工","question":"次の記述のうち，「締固め曲線」について不適当なものはどれか。","choices":["時間と圧密量の関係を示す曲線","温度とコンクリート強度の関係を示す曲線","締固め曲線","交通量と舗装厚の関係を示す曲線"],"answer":4,"explanation":"不適当なのは「交通量と舗装厚の関係を示す曲線」。含水比と乾燥密度の関係を表し、通常は最適含水比付近で最大乾燥密度となる。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P103","category":"土工","question":"「締固め曲線」の施工管理上の主なポイントとして最も適当なものはどれか。","choices":["温度とコンクリート強度の関係を示す曲線","締固め曲線","交通量と舗装厚の関係を示す曲線","時間と圧密量の関係を示す曲線"],"answer":2,"explanation":"含水比と乾燥密度の関係を表し、通常は最適含水比付近で最大乾燥密度となる。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P104","category":"土工","question":"現場で「締固め曲線」を扱う場合の判断として適当なものはどれか。","choices":["交通量と舗装厚の関係を示す曲線","時間と圧密量の関係を示す曲線","締固め曲線","温度とコンクリート強度の関係を示す曲線"],"answer":3,"explanation":"含水比と乾燥密度の関係を表し、通常は最適含水比付近で最大乾燥密度となる。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P105","category":"土工","question":"締固め試験で求める最大乾燥密度について適当なものはどれか。","choices":["締固めによって得られる乾燥密度の最大値","土が完全に水で満たされたときの密度","土粒子だけの密度","盛土全体の湿潤密度"],"answer":1,"explanation":"締固め条件を変えたときに得られる乾燥密度の最大値を求め、施工管理の目安とする。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P106","category":"土工","question":"次の記述のうち，「最大乾燥密度」について不適当なものはどれか。","choices":["土が完全に水で満たされたときの密度","土粒子だけの密度","締固めによって得られる乾燥密度の最大値","盛土全体の湿潤密度"],"answer":4,"explanation":"不適当なのは「盛土全体の湿潤密度」。締固め条件を変えたときに得られる乾燥密度の最大値を求め、施工管理の目安とする。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P107","category":"土工","question":"「最大乾燥密度」の施工管理上の主なポイントとして最も適当なものはどれか。","choices":["土粒子だけの密度","締固めによって得られる乾燥密度の最大値","盛土全体の湿潤密度","土が完全に水で満たされたときの密度"],"answer":2,"explanation":"締固め条件を変えたときに得られる乾燥密度の最大値を求め、施工管理の目安とする。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P108","category":"土工","question":"現場で「最大乾燥密度」を扱う場合の判断として適当なものはどれか。","choices":["盛土全体の湿潤密度","土が完全に水で満たされたときの密度","締固めによって得られる乾燥密度の最大値","土粒子だけの密度"],"answer":3,"explanation":"締固め条件を変えたときに得られる乾燥密度の最大値を求め、施工管理の目安とする。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P109","category":"土工","question":"最適含水比の説明として適当なものはどれか。","choices":["最大乾燥密度が得られる含水比","土が完全に乾燥する含水比","飽和度が必ず0%となる含水比","湿潤密度が必ず最大になる含水比"],"answer":1,"explanation":"締固め曲線上で最大乾燥密度に対応する含水比が最適含水比である。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P110","category":"土工","question":"次の記述のうち，「最適含水比」について不適当なものはどれか。","choices":["土が完全に乾燥する含水比","飽和度が必ず0%となる含水比","最大乾燥密度が得られる含水比","湿潤密度が必ず最大になる含水比"],"answer":4,"explanation":"不適当なのは「湿潤密度が必ず最大になる含水比」。締固め曲線上で最大乾燥密度に対応する含水比が最適含水比である。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P111","category":"土 nswer":2,"explanation":"周辺環境への影響を把握し、必要な施工方法・時間・設備等を見直す。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P496","category":"施工管理法・応用能力","question":"現場で「周辺環境」を扱う場合の判断として適当なものはどれか。","choices":["記録を残さない","苦情を無視する","原因を把握し施工時間・方法等の対策を検討する","作業を増やす"],"answer":3,"explanation":"周辺環境への影響を把握し、必要な施工方法・時間・設備等を見直す。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P497","category":"施工管理法・応用能力","question":"施工管理上重要な情報を関係者へ伝達する際に適当なものはどれか。","choices":["正確・具体的に共有し必要な記録を残す","曖昧に口頭だけで伝える","重要情報を隠す","記録を作らない"],"answer":1,"explanation":"安全・品質・工程に関する情報は正確に共有し、必要な記録を残す。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P498","category":"施工管理法・応用能力","question":"次の記述のうち，「情報共有」について不適当なものはどれか。","choices":["曖昧に口頭だけで伝える","重要情報を隠す","正確・具体的に共有し必要な記録を残す","記録を作らない"],"answer":4,"explanation":"不適当なのは「記録を作らない」。安全・品質・工程に関する情報は正確に共有し、必要な記録を残す。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P499","category":"施工管理法・応用能力","question":"「情報共有」の施工管理上の主なポイントとして最も適当なものはどれか。","choices":["重要情報を隠す","正確・具体的に共有し必要な記録を残す","記録を作らない","曖昧に口頭だけで伝える"],"answer":2,"explanation":"安全・品質・工程に関する情報は正確に共有し、必要な記録を残す。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"},{"id":"P500","category":"施工管理法・応用能力","question":"現場で「情報共有」を扱う場合の判断として適当なものはどれか。","choices":["記録を作らない","曖昧に口頭だけで伝える","正確・具体的に共有し必要な記録を残す","重要情報を隠す"],"answer":3,"explanation":"安全・品質・工程に関する情報は正確に共有し、必要な記録を残す。","source_style":"令和8年度第一次検定の出題テーマ・4択形式を参考にしたオリジナル類題"}];
const categories=["コンクリート", "土工", "基礎工", "安全管理", "施工管理", "施工管理法・応用能力", "河川・砂防", "法規", "測量", "道路・舗装"];
let list=[],i=0,score=0,done=false,modeName="";
const wrongKey="doboku_pro_wrong_v2", histKey="doboku_pro_history_v2";
let wrong=JSON.parse(localStorage.getItem(wrongKey)||"[]");
let history=JSON.parse(localStorage.getItem(histKey)||"{}");

function el(x){return document.getElementById(x)}
function view(id){document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));el(id).classList.remove("hidden");scrollTo(0,0)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function save(){localStorage.setItem(wrongKey,JSON.stringify(wrong));localStorage.setItem(histKey,JSON.stringify(history))}
function home(){
  el("wrongCount").textContent=wrong.length?wrong.length+"問あります。":"まだありません。";
  updateStats(); view("home");
}
function startMode(mode){
  modeName=mode;
  if(mode==="today") list=shuffle(qs).slice(0,10);
  if(mode==="mock") list=shuffle(qs).slice(0,35);
  if(mode==="all") list=shuffle(qs);
  i=0;score=0;view("quiz");render();
}
function startWrong(){
  const a=qs.filter(x=>wrong.includes(x.id));
  if(!a.length){alert("まだ間違えた問題はありません。");return}
  modeName="wrong";list=shuffle(a);i=0;score=0;view("quiz");render();
}
function categoryAccuracy(cat){
  const h=history[cat]; if(!h||!h.n) return null;
  return Math.round(h.c/h.n*100);
}
function weakestCategory(){
  const arr=categories.map(c=>[c,categoryAccuracy(c)]).filter(x=>x[1]!==null);
  if(!arr.length)return null;
  arr.sort((a,b)=>a[1]-b[1]);return arr[0][0];
}
function startWeak(){
  const cat=weakestCategory();
  if(!cat){alert("まず10問ほど解いて、回答履歴をためてみて！");return}
  list=shuffle(qs.filter(x=>x.category===cat)).slice(0,10);i=0;score=0;modeName="weak";view("quiz");render();
}
function startCategory(){
  const cat=el("catSelect").value;
  list=shuffle(qs.filter(x=>x.category===cat)).slice(0,10);i=0;score=0;modeName="category";view("quiz");render();
}
function render(){
  const x=list[i]; done=false;
  el("cat").textContent=x.category;
  el("cnt").textContent=(i+1)+" / "+list.length;
  el("fill").style.width=(i/list.length*100)+"%";
  el("q").textContent=x.question;
  el("fb").innerHTML="";
  el("next").classList.add("hidden");
  el("choices").innerHTML="";
  shuffle(x.choices.map((t,k)=>({t,k}))).forEach(o=>{
    const b=document.createElement("button");b.className="choice";b.textContent=(el("choices").children.length+1)+". "+o.t;
    b.dataset.original=o.k;b.onclick=()=>answer(o.k,b);el("choices").appendChild(b);
  });
}
function answer(n,b){
  if(done)return; done=true;
  const x=list[i],ok=n===x.answer-1;
  document.querySelectorAll(".choice").forEach(z=>{
    z.disabled=true;
    if(Number(z.dataset.original)===x.answer-1)z.classList.add("correct");
    if(z===b&&!ok)z.classList.add("wrong");
  });
  if(ok){score++;wrong=wrong.filter(id=>id!==x.id)}else if(!wrong.includes(x.id))wrong.push(x.id);
  const h=history[x.category]||{n:0,c:0};h.n++;if(ok)h.c++;history[x.category]=h;
  save();
  el("fb").innerHTML=(ok?"<b>正解！</b>":"<b>不正解。</b>")+"<br>正解："+(x.answer)+"番<br>"+x.explanation;
  el("next").classList.remove("hidden");
}
function next(){i++;if(i>=list.length)finish();else render()}
function finish(){
  const rate=Math.round(score/list.length*100);
  el("score").textContent=score+" / "+list.length;
  el("rc").textContent=score;el("rw").textContent=list.length-score;el("rr").textContent=rate+"%";
  el("resultMsg").textContent=rate>=80?"合格圏を意識できる数字。さらに苦手分野を潰そう。":rate>=60?"もう一段。間違い問題を復習して底上げしよう。":"ここから伸びる。間違い問題を中心に繰り返そう。";
  view("result");
}
function updateStats(){
  let n=0,c=0;
  Object.values(history).forEach(h=>{n+=h.n;c+=h.c});
  el("totalAnswered").textContent=n;
  el("totalRate").textContent=n?Math.round(c/n*100)+"%":"—";
  const weak=weakestCategory();
  el("weakText").textContent=weak?("現在の苦手："+weak):"回答履歴をためると判定します。";
  el("catStats").innerHTML=categories.map(c=>{
    const r=categoryAccuracy(c);
    return `<div style="display:flex;justify-content:space-between;border-bottom:1px solid #26364d;padding:8px 0"><span>${c}</span><b>${r===null?"—":r+"%"}</b></div>`;
  }).join("");
}
categories.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;el("catSelect").appendChild(o)});
home();
</script></body></html>
