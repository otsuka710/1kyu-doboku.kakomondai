let list=[],i=0,score=0,done=false;
const key="doboku_practice_wrong_v1";
let wrong=JSON.parse(localStorage.getItem(key)||"[]");
function el(x){return document.getElementById(x)}
function view(id){document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));el(id).classList.remove("hidden");scrollTo(0,0)}
function home(){el("wrong").textContent=wrong.length?wrong.length+"問あります。":"まだありません。";view("home")}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(n){list=shuffle(qs).slice(0,n);i=0;score=0;view("quiz");render()}
function startWrong(){const a=qs.filter(x=>wrong.includes(x.id));if(!a.length){alert("まだ間違えた問題はありません。");return}list=shuffle(a);i=0;score=0;view("quiz");render()}
function render(){const x=list[i];done=false;el("cat").textContent=x.category;el("cnt").textContent=(i+1)+" / "+list.length;el("fill").style.width=(i/list.length*100)+"%";el("q").textContent=x.question;el("fb").innerHTML="";el("next").classList.add("hidden");el("choices").innerHTML="";
x.choices.forEach((t,k)=>{const b=document.createElement("button");b.className="choice";b.textContent=(k+1)+". "+t;b.onclick=()=>answer(k+1,b);el("choices").appendChild(b)})}
function answer(n,b){if(done)return;done=true;const x=list[i],ok=n===x.answer;document.querySelectorAll(".choice").forEach((z,k)=>{z.disabled=true;if(k+1===x.answer)z.classList.add("correct");if(k+1===n&&!ok)z.classList.add("wrong")});if(ok){score++;wrong=wrong.filter(id=>id!==x.id)}else if(!wrong.includes(x.id))wrong.push(x.id);localStorage.setItem(key,JSON.stringify(wrong));el("fb").innerHTML=(ok?"<b>正解！</b>":"<b>不正解。</b>")+"<br>正解："+x.answer+"番<br>"+x.explanation;el("next").classList.remove("hidden")}
function next(){i++;if(i>=list.length)finish();else render()}
function finish(){const rate=Math.round(score/list.length*100);el("score").textContent=score+" / "+list.length;el("rc").textContent=score;el("rw").textContent=list.length-score;el("rr").textContent=rate+"%";view("result")}
home();
</script></body></html>
